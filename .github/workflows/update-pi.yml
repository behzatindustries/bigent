name: Update Pi SDK

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run update-pi

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update pi sdk"
          title: "Update Pi SDK"
          body: "One-click Pi SDK update for BIgent."
          branch: "automation/update-pi-sdk"
